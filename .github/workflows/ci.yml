name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-latest,  preset: ci-linux,   cc: gcc,   cxx: g++     }
          - { name: linux-clang, os: ubuntu-latest,  preset: ci-linux,   cc: clang, cxx: clang++ }
          - { name: macos,       os: macos-latest,   preset: ci-macos    }
          - { name: windows,     os: windows-latest, preset: ci-windows  }

    steps:
      - name: Checkout (main repo, shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Clone vcpkg submodule (full history)
        # vcpkg looks up each port version by tree SHA against the
        # manifest's `builtin-baseline`; a shallow vcpkg clone does
        # not have those historical tree objects, so this submodule
        # must be cloned with full history. The main repo (and any
        # other submodules) stay shallow so this template is cheap
        # to clone in downstream projects with long histories.
        run: git submodule update --init --recursive external/vcpkg

      - name: Compute vcpkg cache key segments
        id: keys
        shell: bash
        run: .github/scripts/vcpkg-cache-keys.sh

      - name: Enable compiler problem matchers
        shell: bash
        run: |
          echo "::add-matcher::.github/matchers/gcc.json"
          echo "::add-matcher::.github/matchers/msvc.json"
          echo "::add-matcher::.github/matchers/cmake.json"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Linux build deps (patchelf, optional clang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang patchelf
          patchelf --version

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create vcpkg binary cache dir
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.vcpkg-cache"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          # Primary: identical image + identical vcpkg SHA + identical vcpkg.json.
          # Restore-key: same image + same vcpkg SHA, only vcpkg.json differs.
          # Adding/removing a dep keeps archives of unchanged ports valid.
          key: vcpkg-archives-${{ steps.keys.outputs.image }}-${{ matrix.name }}-vcpkg-${{ steps.keys.outputs.vcpkg_sha }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ steps.keys.outputs.image }}-${{ matrix.name }}-vcpkg-${{ steps.keys.outputs.vcpkg_sha }}-

      - name: Cache vcpkg bootstrap output
        uses: actions/cache@v5
        with:
          path: |
            external/vcpkg/vcpkg
            external/vcpkg/vcpkg.exe
          # No restore-keys: the executable is tied to a specific vcpkg
          # SHA, no useful partial match. Bootstrap on miss is ~10–20 s.
          # matrix.name is omitted: bootstrap output is compiler-agnostic.
          key: vcpkg-bootstrap-${{ steps.keys.outputs.image }}-vcpkg-${{ steps.keys.outputs.vcpkg_sha }}

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows' && hashFiles('external/vcpkg/vcpkg') == ''
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows' && hashFiles('external/vcpkg/vcpkg.exe') == ''
        shell: cmd
        run: external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure, build, and test
        shell: bash
        env:
          CC:  ${{ matrix.cc  }}
          CXX: ${{ matrix.cxx }}
          VCPKG_ROOT: ${{ github.workspace }}/external/vcpkg
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Dump CMake and vcpkg logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          for f in build/*/vcpkg-manifest-install.log \
                   build/*/CMakeFiles/CMakeError.log \
                   build/*/CMakeFiles/CMakeOutput.log \
                   build/*/Testing/Temporary/LastTest.log; do
            if [ -f "$f" ]; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            fi
          done

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.name }}
          path: |
            build/**/CMakeFiles/CMakeError.log
            build/**/CMakeFiles/CMakeOutput.log
            build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
