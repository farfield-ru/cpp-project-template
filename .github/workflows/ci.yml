name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-latest,  preset: ci-linux,   cc: gcc,   cxx: g++     }
          - { name: linux-clang, os: ubuntu-latest,  preset: ci-linux,   cc: clang, cxx: clang++ }
          - { name: macos,       os: macos-latest,   preset: ci-macos    }
          - { name: windows,     os: windows-latest, preset: ci-windows  }

    steps:
      - name: Checkout (incl. vcpkg submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # vcpkg needs full history of its own repo so it can resolve
          # port versions against the manifest's builtin-baseline; a
          # shallow vcpkg clone makes `git read-tree <port-tree-sha>`
          # fail. actions/checkout applies fetch-depth uniformly to
          # submodules, so we accept full history for the (tiny) main
          # repo too rather than splitting into two steps.
          fetch-depth: 0

      - name: Install Ninja
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Linux build deps (patchelf, optional clang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang patchelf
          patchelf --version

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create vcpkg binary cache dir
        shell: bash
        run: mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('vcpkg.json', '.gitmodules') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.name }}-
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: external\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure, build, and test
        shell: bash
        env:
          CC:  ${{ matrix.cc  }}
          CXX: ${{ matrix.cxx }}
          VCPKG_ROOT: ${{ github.workspace }}/external/vcpkg
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.name }}
          path: |
            build/**/CMakeFiles/CMakeError.log
            build/**/CMakeFiles/CMakeOutput.log
            build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
