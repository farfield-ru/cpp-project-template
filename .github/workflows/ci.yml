name: CI

on:
  # Run on push to main so caches get saved under main's scope after
  # every merge. GitHub Actions scopes caches to the branch that
  # created them plus the default branch; without a main-triggered
  # run there is no way for a fresh PR branch to see cache entries
  # from prior PRs.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check formatting
        shell: bash
        run: .github/scripts/clang-format-check.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-latest,  preset: ci-linux,   cc: gcc,   cxx: g++     }
          - { name: linux-clang, os: ubuntu-latest,  preset: ci-linux,   cc: clang, cxx: clang++ }
          - { name: macos,       os: macos-latest,   preset: ci-macos    }
          - { name: windows,     os: windows-latest, preset: ci-windows  }

    steps:
      - name: Checkout (main repo, shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Clone vcpkg submodule (full history)
        # vcpkg looks up each port version by tree SHA against the
        # manifest's `builtin-baseline`; a shallow vcpkg clone does
        # not have those historical tree objects, so this submodule
        # must be cloned with full history. The main repo (and any
        # other submodules) stay shallow so this template is cheap
        # to clone in downstream projects with long histories.
        run: git submodule update --init --recursive external/vcpkg

      - name: Compute vcpkg cache key segments
        id: keys
        shell: bash
        run: .github/scripts/vcpkg-cache-keys.sh

      - name: Enable compiler problem matchers
        shell: bash
        run: |
          echo "::add-matcher::.github/matchers/gcc.json"
          echo "::add-matcher::.github/matchers/msvc.json"
          echo "::add-matcher::.github/matchers/cmake.json"

      - name: Set up MSVC dev environment
        # vswhere + the VS DevShell PowerShell module are preinstalled
        # on windows-latest; this populates INCLUDE/LIB/LIBPATH/PATH for
        # subsequent steps via $GITHUB_ENV, the same effect msvc-dev-cmd
        # was producing.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-ChildItem env: |
            ForEach-Object { "$($_.Name)=$($_.Value)" } |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create vcpkg binary cache dir
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.vcpkg-cache"

      - name: Restore vcpkg binary archives
        # vcpkg names archives by its own ABI hash, so old archives that
        # don't match the current toolchain are inert (ignored), not
        # harmful. We restore whatever the most recent cache for this
        # (image, matrix entry) has and let vcpkg decide what is reusable.
        # The primary key intentionally won't match anything since the
        # save side appends a content hash; restore-keys does the lookup.
        id: archives-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-archives-${{ steps.keys.outputs.image }}-${{ matrix.name }}-NEVER-MATCH
          restore-keys: |
            vcpkg-archives-${{ steps.keys.outputs.image }}-${{ matrix.name }}-

      - name: Cache vcpkg bootstrap output
        uses: actions/cache@v5
        with:
          path: |
            external/vcpkg/vcpkg
            external/vcpkg/vcpkg.exe
          # No restore-keys: the executable is tied to a specific vcpkg
          # SHA, no useful partial match. Bootstrap on miss is ~10–20 s.
          # matrix.name is omitted: bootstrap output is compiler-agnostic.
          key: vcpkg-bootstrap-${{ steps.keys.outputs.image }}-vcpkg-${{ steps.keys.outputs.vcpkg_sha }}

      - name: Bootstrap vcpkg
        # Skip when the bootstrap cache restored the executable. hashFiles
        # returns '' only when *neither* file exists, which is the
        # only state in which bootstrap actually needs to run.
        if: hashFiles('external/vcpkg/vcpkg', 'external/vcpkg/vcpkg.exe') == ''
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./external/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure, build, and test
        shell: bash
        env:
          CC:  ${{ matrix.cc  }}
          CXX: ${{ matrix.cxx }}
          VCPKG_ROOT: ${{ github.workspace }}/external/vcpkg
          # Explicit binary source list. `clear` removes the implicit
          # default backend so we deterministically use exactly this
          # files-based cache for both reads and writes, regardless of
          # vcpkg's defaults across versions.
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Hash .vcpkg-cache for save key
        # Suffix of the save key. Lets the save step decide whether the
        # cache content actually changed since restore.
        id: archives-content
        if: always()
        shell: bash
        run: .github/scripts/vcpkg-cache-content-hash.sh

      - name: Save vcpkg binary archives
        # Three guards (see plan doc / commit message for the full
        # walk-through):
        #   always()       — run even when build/tests failed; partially
        #                    populated caches are still useful.
        #   hash != empty  — skip when there are no archives to save.
        #   !endsWith(...) — skip when content is byte-identical to what
        #                    we restored (no churn for no-op runs).
        if: |
          always()
          && steps.archives-content.outputs.hash != 'empty'
          && !endsWith(steps.archives-restore.outputs.cache-matched-key || '', steps.archives-content.outputs.hash)
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-archives-${{ steps.keys.outputs.image }}-${{ matrix.name }}-${{ steps.archives-content.outputs.hash }}

      - name: Dump CMake and vcpkg logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          for f in build/*/vcpkg-manifest-install.log \
                   build/*/CMakeFiles/CMakeError.log \
                   build/*/CMakeFiles/CMakeOutput.log \
                   build/*/Testing/Temporary/LastTest.log; do
            if [ -f "$f" ]; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            fi
          done

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.name }}
          path: |
            build/**/CMakeFiles/CMakeError.log
            build/**/CMakeFiles/CMakeOutput.log
            build/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
